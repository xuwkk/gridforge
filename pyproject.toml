[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "gridforge"
dynamic = ["version"]
description = "Power system configuration and optimization toolkit."
readme = "readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wangkun Xu" }]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "pyyaml>=6",
  "tqdm>=4.60",
  "openpyxl>=3.1",
  "cvxpy>=1.3",
  "PYPOWER>=5.1",
  "cvxpy-summary @ git+https://github.com/xuwkk/cvxpy_summary.git@v0.0.1"
]

[project.scripts]
gridforge-app = "gridforge.app_cli:main"

[project.optional-dependencies]
gurobi = ["gurobipy"]
viz = ["networkx>=2.8", "matplotlib>=3.6", "plotly>=5"]
app = ["streamlit>=1.28"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9", "pymdown-extensions>=10"]
full = ["streamlit>=1.28", "networkx>=2.8", "matplotlib>=3.6", "plotly>=5"]

[tool.setuptools.packages.find]
include = ["gridforge*"]

[tool.setuptools_scm]
tag_regex = "^(?:v)?(?P<version>\\d+\\.\\d+\\.\\d+)$"
