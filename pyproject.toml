[build-system]
requires = ["setuptools>=77", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "powergridforge"
dynamic = ["version"]
description = "Explicit case preparation and AC/DC network matrices for power systems."
readme = "readme.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wangkun Xu" }]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "PYPOWER>=5.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
docs = ["mkdocs>=1.5", "mkdocs-material>=9", "pymdown-extensions>=10"]
dev = [
  "pytest>=7",
  "mkdocs>=1.5",
  "mkdocs-material>=9",
  "pymdown-extensions>=10",
]

[tool.setuptools.packages.find]
include = ["gridforge*"]

[tool.setuptools_scm]
tag_regex = "^(?:v)?(?P<version>\\d+\\.\\d+\\.\\d+)$"
