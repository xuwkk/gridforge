site_name: GridForge
site_description: Explicit case preparation and AC/DC network matrices
repo_url: https://github.com/xuwkk/gridforge
repo_name: xuwkk/gridforge

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Worked Tutorial: tutorial.md
  - API Reference: api-reference.md
  - Cases And Tables: case.md
  - Connection Matrices: connection-matrix.md
  - DC Model: dc-network.md
  - AC Network Model: ac-network.md
  - Copyright And License: copyright.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
